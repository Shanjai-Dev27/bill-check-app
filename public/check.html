<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivery - Check Bill</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f4f8; display: flex; justify-content: center; padding: 40px 16px; }
    .card { background: #fff; padding: 28px; border-radius: 10px; width: 100%; max-width: 380px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    h2 { margin-top: 0; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 16px; width: 100%; padding: 11px; font-size: 16px; background: #16a34a; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    button:hover { background: #15803d; }
    #msg { margin-top: 18px; font-size: 22px; font-weight: bold; text-align: center; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
    a { display: block; margin-top: 18px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Delivery: Check Bill</h2>
    <form id="checkForm">
      <label for="billNumber">Bill Number</label>
      <input type="text" id="billNumber" name="billNumber" placeholder="Enter bill number" required autofocus>
      <button type="submit">Check</button>
    </form>
    <div id="msg"></div>
    <a href="/admin">← Admin page</a>
  </div>

  <script>
    const form = document.getElementById('checkForm');
    const input = document.getElementById('billNumber');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const res = await fetch('/api/bills/check?billNumber=' + encodeURIComponent(input.value));
        const data = await res.json();
        msg.textContent = data.message;
        msg.className = data.paid ? 'ok' : 'err';
      } catch (err) {
        msg.textContent = 'Could not reach the server.';
        msg.className = 'err';
      }
    });
  </script>
</body>
</html>
